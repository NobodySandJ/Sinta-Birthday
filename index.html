<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Sinta!</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎀</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&family=Pacifico&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.6.2/dist/dotlottie-wc.js" type="module"></script>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

    <div id="welcome-screen" style="opacity: 1; transform: scale(1);">
        <div class="welcome-content">
            <div id="year-selector-view">
                <h2>Tahun Lahir Kamu? 🤔</h2>
                <div class="slider-container">
                    <input type="range" min="1999" max="2012" value="2001" class="slider" id="birthyear-slider">
                    <p id="year-display">2001</p>
                </div>
                <div class="color-picker-container">
                    <label>Pilih Warna Temamu:</label>
                    <div id="theme-options" class="theme-options-container">
                        <div class="theme-option" data-color="#4caf50" style="background-color: #4caf50;"></div>
                        <div class="theme-option selected" data-color="#ff6b9d" style="background-color: #ff6b9d;"></div>
                        <div class="theme-option" data-color="#673ab7" style="background-color: #673ab7;"></div>
                        <div class="theme-option" data-color="#e91e63" style="background-color: #e91e63;"></div>
                        <div class="theme-option" data-color="#ff9800" style="background-color: #ff9800;"></div>
                        <div class="theme-option" data-color="#00bcd4" style="background-color: #00bcd4;"></div>
                    </div>
                </div>
                <div id="lottie-gift-container">
                     <dotlottie-wc
                        src="https://lottie.host/b5289d12-8de3-4b08-bce2-32c94b642be0/kt2iTQozjP.lottie"
                        style="width: 250px; height: 250px; cursor: pointer;"
                        speed="1"
                        autoplay
                        loop>
                    </dotlottie-wc>
                </div>
                <p class="gift-instruction">Klik kado untuk melanjutkan! ✨</p>
            </div>
        </div>
    </div>

    <div id="loading-screen" style="display: none; opacity: 0;">
        <div class="loading-content">
            <div id="loading-elements">
                <dotlottie-wc
                    src="https://lottie.host/0c1f5a6b-9b4b-4b8b-87b7-1c3905f0e1b6/VMAa1g2Z8E.lottie"
                    style="width: 250px; height: 250px;"
                    speed="1"
                    autoplay
                    loop>
                </dotlottie-wc>
                <p>Memuat kejutan...</p>
            </div>
            <button id="start-surprise-btn">Mulai ✨</button>
        </div>
    </div>
    
    <div id="ucapan-content" style="display: none;">
        <audio id="audio-element" preload="auto"></audio>
        <div class="progress-bar" id="progress-bar"></div>
        <div id="background-animation"></div>

        <main id="main-content">
            <section id="lottie-section" class="fade-in-up">
                <dotlottie-wc src="https://lottie.host/5f089ce5-d66c-4b52-91cb-292456503ce2/PTf0Sn1cF8.lottie" style="width: 300px;" speed="1" autoplay loop></dotlottie-wc>
            </section>

            <section id="personal-message-section" class="fade-in-up">
                <div class="message-card">
                    <div id="personal-greeting">
                        <span id="greeting-line-1"></span>
                        <span id="greeting-line-2"></span>
                    </div>
                    <p id="personal-message"></p>
                    <p id="personal-signature"></p>
                </div>
            </section>

            <section id="timeline-section" class="fade-in-up">
                <h2 class="section-title">Jejak Memori 📝</h2>
                <div id="timeline-container" class="timeline"></div>
            </section>

            <section id="gallery-section" class="fade-in-up">
                <h2 class="section-title">Galeri Sinta🖼️</h2>
                <div id="photo-gallery" class="gallery-grid"></div>
            </section>

            <section id="video-section" class="fade-in-up">
                <h2 class="section-title">Fancam dikit 🎞️</h2>
                <div id="video-list" class="video-grid"></div>
            </section>

            <section id="video-edit-section" class="fade-in-up">
                <h2 class="section-title">Video JJ dikit</h2>
                <div class="video-grid">
                    <div class="video-item">
                        <video width="100%" controls>
                            <source src="assets/video_edit.mp4" type="video/mp4">
                            Browser kamu tidak mendukung pemutaran video.
                        </video>
                    </div>
                </div>
            </section>

            <footer class="fade-in-up">
                <p>birthday project by Ferdy (@ikifer)</p>
                <p style="margin-top: 10px; font-size: 0.85rem;">Maap kan ke gabut an ku ya,wkwwk</p>
            </footer>
        </main>
        
        <div id="music-player">
            <div class="player-container">
                <img id="player-artwork" src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iNjAiIHZpZXdCb3g9IjAgMCA2MCA2MCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHJlY3Qgd2lkdGg9IjYwIiBoZWlnaHQ9IjYwIiByeD0iMTIiIGZpbGw9InVybCgjZ3JhZGllbnQpIi8+CjxwYXRoIGQ9Ik0yNCAyMkwyNCAzOEwzNiAzMEwyNCAyMloiIGZpbGw9IndoaXRlIi8+CjxkZWZzPgo8bGluZWFyR3JhZGllbnQgaWQ9ImdyYWRpZW50IiB4MT0iMCIgeTE9IjAiIHgyPSI2MCIgeTI9IjYwIiBncmFkaWVudFVuaXRzPSJ1c2VyU3BhY2VPblVzZSI+CjxzdG9wIHN0b3AtY29sb3I9IiNmZjZiOWQiLz4KPHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjZmY4ZmFiIi8+CjwvbGluZWFyR3JhZGllbnQ+CjwvZGVmcz4KPC9zdmc+" alt="Album Art">
                <div class="player-info">
                    <p id="player-title">Pilih Lagu</p>
                    <p id="player-artist">Untuk memulai</p>
                </div>
                <div class="player-controls">
                    <button id="prev-btn" aria-label="Previous Track"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M18 18V6H16V18H18ZM8 12L14 6V18L8 12Z" fill="currentColor"/></svg></button>
                    <button id="play-pause-btn" aria-label="Play or Pause Track"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 5V19L19 12L8 5Z" fill="currentColor"/></svg></button>
                    <button id="next-btn" aria-label="Next Track"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 6V18H8V6H6ZM16 12L10 18V6L16 12Z" fill="currentColor"/></svg></button>
                </div>
            </div>
        </div>

        <div id="lightbox" class="lightbox" role="dialog" aria-label="Image Viewer">
            <span class="lightbox-close" aria-label="Close">&times;</span>
            <img class="lightbox-content" id="lightbox-img" alt="Full size image">
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
